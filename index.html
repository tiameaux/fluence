<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mots</title>
<meta name="theme-color" content="#1F5E63" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131A1C" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F2F3EF; --surface:#FFFFFF; --sunk:#E6E9E3; --ink:#1B2326; --muted:#5B6768; --line:#D6DBD3;
  --accent:#1F5E63; --accent-ink:#FFFFFF;
  --green:#1E7A4C; --green-bg:#DDF0E4; --green-line:#8FCBA8;
  --amber:#8A5B00; --amber-bg:#FBEFCF; --amber-line:#E6C46E;
  --red:#A23B3B; --en:#9A3B3B;
  --serif:"Literata","Noto Serif",Georgia,serif;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131A1C; --surface:#1B2427; --sunk:#172023; --ink:#E4E9E5; --muted:#98A5A3; --line:#2C383A;
    --accent:#6DB5B1; --accent-ink:#0E1618;
    --green:#7FD3A5; --green-bg:#173A2A; --green-line:#2F6B4C;
    --amber:#F0C766; --amber-bg:#3A2F12; --amber-line:#6B5520;
    --red:#E58E8E; --en:#E08D8D;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131A1C; --surface:#1B2427; --sunk:#172023; --ink:#E4E9E5; --muted:#98A5A3; --line:#2C383A;
  --accent:#6DB5B1; --accent-ink:#0E1618;
  --green:#7FD3A5; --green-bg:#173A2A; --green-line:#2F6B4C;
  --amber:#F0C766; --amber-bg:#3A2F12; --amber-line:#6B5520;
  --red:#E58E8E; --en:#E08D8D;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-tap-highlight-color:transparent}
#app{max-width:560px;min-height:100%;margin:0 auto;padding-inline:16px;padding-block:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 72px);display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--serif);font-weight:600;font-size:2.2rem;line-height:1.1;margin:0}
h2{font-family:var(--serif);font-weight:600;font-size:1.1rem;margin:0}
button{font-family:var(--sans);color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.home-head{display:flex;flex-direction:column;gap:2px;padding-top:12px}
.date{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.today{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big-stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column}
.big-stat b{font-family:var(--serif);font-size:2.6rem;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
.big-stat span{color:var(--muted);font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stats.three{grid-template-columns:repeat(3,1fr)}
.stats div{display:flex;flex-direction:column;gap:2px;padding:10px 4px;border-top:1px solid var(--line)}
.stats b{font-family:var(--serif);font-size:1.35rem;font-weight:600;font-variant-numeric:tabular-nums}
.stats span{font-size:.75rem;color:var(--muted);line-height:1.25}
.ok{color:var(--green)} .mid{color:var(--amber)} .ko{color:var(--red)}
.btn{border:0;border-radius:12px;font-weight:600;font-size:1rem;padding:13px 16px;cursor:pointer}
.btn.xl{padding:18px 16px;font-size:1.1rem;width:100%}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn:active{transform:scale(.985)}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:.95rem;padding:8px 0;cursor:pointer}
.hint,.empty{color:var(--muted);font-size:.9rem;margin:0}
.empty{font-size:1rem;color:var(--ink)}
.foot{margin-top:auto;display:flex;justify-content:center}
/* séance */
.bar{display:flex;align-items:center;gap:12px;min-height:44px}
.bar-title{font-weight:600}
.icon{background:none;border:0;font-size:1.25rem;width:44px;height:44px;border-radius:10px;cursor:pointer;color:var(--muted);flex:none}
.meter{flex:1;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent);border-radius:3px}
.count{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;min-width:3.5em;text-align:right}
.card{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding-block:12px}
.tag{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.prompt{font-family:var(--serif);font-size:1.45rem;line-height:1.45;margin:0;text-wrap:pretty}
.prompt.small{font-size:1rem;color:var(--muted)}
.gap{display:inline-block;min-width:3.4em;border-bottom:2.5px solid var(--accent);transform:translateY(-4px)}
.vs{font-style:italic;color:var(--muted)}
em.en{font-style:italic;font-weight:600;color:var(--en)}
.actions{display:flex;flex-direction:column;gap:10px}
.actions.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#app > .actions:last-child{margin-top:auto}
.ans-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.discard{background:none;border:1px solid var(--line);color:var(--muted);font-size:.78rem;padding:6px 10px;border-radius:8px;cursor:pointer;text-align:right}
.words{display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding-block:6px}
.word{border-radius:14px;cursor:pointer;font-family:var(--serif);font-weight:600;border:2px solid transparent;text-align:left}
.word.target{font-size:2rem;line-height:1.2;padding:10px 18px;background:var(--green-bg);color:var(--green);border-color:var(--green-line)}
.alts{display:flex;flex-wrap:wrap;gap:8px}
.word.alt{font-size:1.2rem;padding:8px 14px;background:var(--amber-bg);color:var(--amber);border-color:var(--amber-line)}
.word.small{font-size:.95rem;padding:5px 11px}
.word:disabled{cursor:default;opacity:1}
.word:not(:disabled):active{transform:scale(.97)}
.ex{font-family:var(--serif);font-style:italic;font-size:1.05rem;margin:0;padding-left:12px;border-left:3px solid var(--green-line)}
.ex b{font-style:normal;color:var(--green)}
#app{touch-action:pan-y}
.note{font-size:.92rem;background:var(--sunk);border-radius:10px;padding:10px 12px;margin:0}
.instr{margin:0;text-align:center;color:var(--muted);font-size:.9rem}
/* réglages */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.stepper{display:flex;align-items:center;gap:4px}
.stepper output{min-width:2.2em;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;font-size:1.1rem}
.stepper .icon{background:var(--sunk);color:var(--ink)}
textarea{width:100%;min-height:70px;font:.85rem var(--sans);color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px}
input[type=file]{font-size:.85rem;color:var(--muted);max-width:100%}
#toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);max-width:528px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.92rem;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#toast .link{color:var(--bg);text-decoration:underline;flex:none}

/* séance : aides */
button.gap{display:inline-block;min-width:3.4em;height:1em;border:0;border-bottom:2.5px solid var(--accent);background:transparent;padding:0;transform:translateY(-4px);cursor:pointer;vertical-align:baseline}
button.gap:active{background:var(--sunk)}
.aids{display:flex;gap:8px;flex-wrap:wrap}
.aid{display:inline-flex;align-items:center;gap:6px;background:var(--sunk);border:1px solid var(--line);color:var(--muted);font-size:.85rem;font-weight:600;padding:7px 12px;border-radius:999px;cursor:pointer}
.aid:disabled{opacity:.45;cursor:default}
.reveal{font-family:var(--serif);font-size:1.05rem;line-height:1.45;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.hintbox{font-size:1.6rem;font-weight:600;letter-spacing:.04em;color:var(--amber);padding:6px 14px}
.hintbox .dots{color:var(--muted);font-weight:400}
.defline{margin:0;font-size:.92rem;color:var(--muted)}
/* accueil */
.today-card p{margin:0;color:var(--ink)}
.today-card h2{font-size:1.25rem}
.progress-list{display:flex;flex-direction:column;gap:6px}
.progress-list h2{font-size:1rem;color:var(--muted);font-family:var(--sans);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.progress-list dl{margin:0;display:flex;flex-direction:column}
.progress-list dl div{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.progress-list dt{color:var(--ink)}
.progress-list dt .sub{color:var(--muted);font-size:.85rem}
.progress-list dd{margin:0;font-family:var(--serif);font-weight:600;font-size:1.2rem;font-variant-numeric:tabular-nums}
.count{min-width:auto;white-space:nowrap}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.card,.words{animation:in .16s ease-out}@keyframes in{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<main id="app"></main>
<script src="words.js"></script>
<script src="app.js"></script>
</body>
</html>
